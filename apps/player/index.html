<head>

    <title data-i18n="misc.doc_title">塔卡 (TAKA)</title>
    <style>
        /* First paint: real preload progress is carried by a dim eye and rising bubbles. */
        #boot-splash{position:fixed;inset:0;z-index:200;background:#050d14;color:#b3c3bb;font-family:"Source Han Serif SC","Noto Serif SC","Songti SC","STSong",Georgia,serif;opacity:1;visibility:visible;transition:opacity .28s,visibility 0s;--boot-progress:0}
        #boot-splash::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 18%,#38687810,transparent 65%);pointer-events:none}
        #boot-splash.bs-out{opacity:0;visibility:hidden;pointer-events:none;transition:opacity .28s,visibility 0s linear .28s}
        .bs-eye{position:absolute;left:50%;top:52%;width:30px;height:30px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff6d2,#f0c16a 35%,#b5781b);opacity:calc(.35 + var(--boot-progress)*.65);box-shadow:0 0 calc(5px + var(--boot-progress)*14px) #f4c36c50;animation:bs-breathe 3.8s ease-in-out infinite}
        @keyframes bs-breathe{50%{filter:brightness(.78)}}
        .bs-status{position:absolute;top:calc(52% + 110px);left:24px;right:24px;text-align:center;font-size:12px;letter-spacing:.15em;line-height:1.8;opacity:.66}
        .bs-bubbles{position:absolute;left:50%;top:17%;bottom:48%;width:120px;transform:translateX(-50%);pointer-events:none}
        .bs-bubbles i{position:absolute;left:var(--bx);bottom:0;width:var(--size,5px);height:var(--size,5px);border:1px solid #b5d3d467;border-radius:49%;opacity:0;box-shadow:inset 0 1px #e1e9db30;animation:bs-rise var(--time,2.7s) var(--delay,0s) linear infinite}
        @keyframes bs-rise{0%{opacity:0;transform:translate(0,0) scale(.7)}15%{opacity:calc(.2 + var(--boot-progress)*.35)}85%{opacity:.3}100%{opacity:0;transform:translate(var(--drift,6px),min(-29svh,-80px)) scale(1.15)}}
        @media(max-height:500px) and (orientation:landscape){.bs-eye{top:47%}.bs-bubbles{bottom:53%;top:10%}.bs-status{top:calc(47% + 75px);font-size:11px}}
        @media(prefers-reduced-motion:reduce){.bs-eye,.bs-bubbles i{animation:none}.bs-bubbles i{opacity:.2;bottom:calc(var(--boot-progress)*75%)}#boot-splash.bs-out{transition:none}}
    </style>
</head>
<body>

<!-- 全局 UI 手绘滤镜：独立于塔卡立绘，像素换装与跨故事切换后仍可使用。 -->
<svg width="0" height="0" style="position:absolute;pointer-events:none" aria-hidden="true">
    <defs>
        <filter id="handDrawnEdge" x="-20%" y="-30%" width="140%" height="160%">
            <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="13" result="ui-paper-noise"/>
            <feDisplacementMap in="SourceGraphic" in2="ui-paper-noise" scale="1.6" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
    </defs>
</svg>

<!-- 启动闪屏：boot 期间盖全屏（z-index 高于启动门），加载进度由 main.ts 驱动；
     进故事（异包）时复用为「故事加载」模式。完成后加 .bs-out 淡出。 -->
<div id="boot-splash" role="progressbar" aria-label="塔卡正在醒来" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <div class="bs-eye" aria-hidden="true"></div>
    <div class="bs-bubbles" aria-hidden="true"><i style="--bx:44%;--delay:-.1s"></i><i style="--bx:61%;--size:7px;--delay:-1.3s;--time:3.1s;--drift:-8px"></i><i style="--bx:34%;--size:3px;--delay:-.7s"></i><i style="--bx:53%;--size:5px;--delay:-1.9s;--time:3.4s"></i><i style="--bx:72%;--size:4px;--delay:-2.2s;--drift:-12px"></i></div>
    <div class="bs-status" id="bs-status" data-i18n="boot.charging">在水底，攒一点光。</div>
</div>
