<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <link rel="alternate icon" href="./favicon-192.png" type="image/png">
    <link rel="apple-touch-icon" href="./favicon-192.png">
    <title data-i18n="misc.doc_title">塔卡 (TAKA)</title>
</head>
<body>

<div class="bg-layer" id="bg-a"></div>
<div class="bg-layer" id="bg-b"></div>
<div class="bg-shade"></div>

<div id="stage">
    <div class="hud">
        <button class="lang-toggle" id="lang-toggle" title="中文 / English">中 / EN</button>
        <div class="core-ico" id="core-ico" title="塔卡的能源核心">
            <svg viewBox="0 0 32 32">
                <circle class="core-ring" cx="16" cy="16" r="12.5"/>
                <circle class="core-arc" id="core-arc" cx="16" cy="16" r="12.5"/>
                <path class="core-bolt" d="M17.4 9.6 L13.4 16.5 H16.1 L15 22.4 L19.8 15.3 H16.9 Z"/>
            </svg>
        </div>
        <span id="battery-text">100%</span>
    </div>

    <button class="log-btn" id="log-btn" data-i18n-title="log.btn_title" title="旅程日志">📖</button>
    <button class="settings-btn" id="settings-btn" data-i18n-title="misc.settings_btn_title" title="设置">⚙</button>
    <button class="ach-btn" id="ach-btn" data-i18n-title="ach.btn_title" title="成就">🏅</button>
    <button class="speech-btn" id="speech-btn" data-i18n-title="speech.btn_title" title="语音开关">🔊</button>
    <button class="parent-btn" id="parent-btn" data-i18n-title="misc.parent_btn_title" title="家长入口">👤</button>
    <div class="parent-overlay" id="parent-overlay" hidden>
        <div class="ach-modal parent-modal">
            <div class="am-title" data-i18n="auth.parent_title">家 长</div>
            <div id="parent-body"></div>
        </div>
    </div>
    <div class="settings-panel" id="settings-panel" hidden>
        <div class="sp-title" data-i18n="settings.title">设 置</div>
        <label class="sp-toggle"><input type="checkbox" id="sp-enabled"> <span data-i18n="settings.allow_free">允许孩子自由发挥（需登录）</span></label>
        <label class="sp-toggle"><input type="checkbox" id="sp-readchoices"> <span data-i18n="settings.read_choices">朗读选项（家长代读 / 大孩子可关）</span></label>
        <label><span data-i18n="settings.rate">语速</span> <span id="sp-rate-val">0.95x</span>
            <input type="range" id="sp-rate" min="0.5" max="1.5" step="0.05" value="0.95">
        </label>
        <label><span data-i18n="settings.layout">页面布局</span>
            <select id="sp-layout">
                <option value="auto" data-i18n="settings.layout_auto">自动</option>
                <option value="book" data-i18n="settings.layout_book">翻页书</option>
                <option value="vn" data-i18n="settings.layout_vn">小说</option>
            </select>
        </label>
        <div class="sp-note" data-i18n="settings.note">AI 生成在服务端完成，经过内容安全校验；每个账号每日限 50 次。开场、高潮与结局为定稿文本，AI 只承接孩子的自由想法。</div>
        <div class="sp-nav">
            <button id="sp-toshelf"><span class="sp-shelf-ico"></span><span data-i18n="settings.to_shelf">保存并返回书架</span></button>
            <button id="sp-logout" hidden data-i18n="auth.logout">退出登录</button>
        </div>
    </div>
    <div class="ai-status" id="ai-status"></div>

    <div class="start-gate" id="start-gate" hidden>
        <div class="gate-eye"></div>
        <div class="gate-title" data-i18n="gate.title">塔 卡</div>
        <button class="gate-btn" id="gate-btn" data-i18n="gate.enter">点一下，听风声</button>
        <button class="gate-parent" id="gate-parent" data-i18n="gate.parent">家长入口</button>
    </div>
    <div class="toast" id="toast"></div>

    <main class="shelf-screen" id="shelf-screen" hidden></main>

    <div class="ach-overlay" id="ach-overlay" hidden>
        <div class="ach-modal">
            <div class="am-title" data-i18n="ach.modal_title">成 就</div>
            <div id="ach-list"></div>
        </div>
    </div>

    <div class="ach-wall" id="ach-wall" hidden>
        <div class="ach-wall-panel">
            <button class="aw-close" id="aw-close">✕</button>
            <div class="aw-heading" data-i18n="ach.wall_title">成 就 墙</div>
            <div id="ach-wall-body"></div>
        </div>
    </div>

    <div class="taka-figure st-standby" id="taka-figure">
        <!-- 思考演出（st-pondering 时浮现）：思想泡泡，三圆点依次跳动 -->
        <div class="thought-bubble" aria-hidden="true"><i></i><i></i><i></i></div>
        <svg viewBox="0 0 220 210">
            <defs>
                <linearGradient id="metalGrad" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0" stop-color="#b3bdc9"/>
                    <stop offset="0.55" stop-color="#7d8896"/>
                    <stop offset="1" stop-color="#5d6875"/>
                </linearGradient>
                <radialGradient id="eyeGrad" cx="0.5" cy="0.45" r="0.6">
                    <stop offset="0" stop-color="#fff6d8"/>
                    <stop offset="0.55" stop-color="#ffb703"/>
                    <stop offset="1" stop-color="#9c7108"/>
                </radialGradient>
                <!-- 螺钉 9 颗：上 3、下 2（角落）、两侧各 2 -->
                <g id="nutRing" fill="#525d6b" stroke="#39424e">
                    <polygon points="77.5,55 75.25,58.9 70.75,58.9 68.5,55 70.75,51.1 75.25,51.1"/>
                    <polygon points="114.5,55 112.25,58.9 107.75,58.9 105.5,55 107.75,51.1 112.25,51.1"/>
                    <polygon points="151.5,55 149.25,58.9 144.75,58.9 142.5,55 144.75,51.1 149.25,51.1"/>
                    <polygon points="77.5,140 75.25,143.9 70.75,143.9 68.5,140 70.75,136.1 75.25,136.1"/>
                    <polygon points="69.5,72 67.25,75.9 62.75,75.9 60.5,72 62.75,68.1 67.25,68.1"/>
                    <polygon points="69.5,112 67.25,115.9 62.75,115.9 60.5,112 62.75,108.1 67.25,108.1"/>
                    <polygon points="159.5,72 157.25,75.9 152.75,75.9 150.5,72 152.75,68.1 157.25,68.1"/>
                    <polygon points="159.5,112 157.25,115.9 152.75,115.9 150.5,112 152.75,108.1 157.25,108.1"/>
                </g>
                <!-- 松动带锈的一颗：前面板右下角，正面专属 -->
                <g id="rustNut" transform="rotate(20 147 140)">
                    <polygon points="151.5,140 149.25,143.9 144.75,143.9 142.5,140 144.75,136.1 149.25,136.1" fill="#6b5335" stroke="#8a4b2a"/>
                </g>
                <!-- 双臂：链条 3 节 + 喇叭口 -->
                <g id="arms">
                    <circle cx="50" cy="115" r="4.5" fill="none" stroke="#6b7686" stroke-width="2.5"/>
                    <circle cx="43" cy="125" r="4.5" fill="none" stroke="#6b7686" stroke-width="2.5"/>
                    <circle cx="39" cy="136" r="4.5" fill="none" stroke="#6b7686" stroke-width="2.5"/>
                    <path d="M37 139 L27 154 Q35 162 44 155 L40.5 142 Z" fill="#525d6b" stroke="#39424e" stroke-width="1.5"/>
                    <circle cx="170" cy="115" r="4.5" fill="none" stroke="#6b7686" stroke-width="2.5"/>
                    <circle cx="177" cy="125" r="4.5" fill="none" stroke="#6b7686" stroke-width="2.5"/>
                    <circle cx="181" cy="136" r="4.5" fill="none" stroke="#6b7686" stroke-width="2.5"/>
                    <path d="M183 139 L193 154 Q185 162 176 155 L179.5 142 Z" fill="#525d6b" stroke="#39424e" stroke-width="1.5"/>
                </g>
                <!-- 伸缩腿：陆地模式（伸出） -->
                <g id="legs">
                    <rect x="80" y="145" width="10" height="16" fill="#525d6b" stroke="#39424e"/>
                    <rect x="81.5" y="159" width="7" height="18" fill="#414b58" stroke="#39424e" stroke-width="1"/>
                    <rect x="72" y="176" width="26" height="9" rx="4.5" fill="#39424e"/>
                    <rect x="130" y="145" width="10" height="16" fill="#525d6b" stroke="#39424e"/>
                    <rect x="131.5" y="159" width="7" height="18" fill="#414b58" stroke="#39424e" stroke-width="1"/>
                    <rect x="122" y="176" width="26" height="9" rx="4.5" fill="#39424e"/>
                </g>
                <!-- 伸缩腿：水下模式（收回贴腹，备用） -->
                <g id="legsStub">
                    <rect x="80" y="145" width="10" height="8" fill="#525d6b" stroke="#39424e"/>
                    <rect x="130" y="145" width="10" height="8" fill="#525d6b" stroke="#39424e"/>
                </g>
                <!-- 机体壳：身体 + 螺钉 + 眼睛外环 + 胸口面板（不含眼睛的光） -->
                <g id="bodyShell">
                    <rect x="60" y="50" width="100" height="95" rx="9" fill="url(#metalGrad)" stroke="#414b58" stroke-width="2"/>
                    <use href="#nutRing"/>
                    <use href="#rustNut"/>
                    <circle cx="110" cy="92" r="27" fill="#18212b" stroke="#39424e" stroke-width="3"/>
                    <rect x="88" y="124" width="44" height="13" rx="4" fill="#414b58" opacity="0.65"/>
                    <circle cx="97" cy="130.5" r="2" fill="#48bb78"/>
                    <circle cx="106" cy="130.5" r="2" fill="#718096"/>
                    <circle cx="115" cy="130.5" r="2" fill="#718096"/>
                </g>
                <!-- 完整个体：陆地 / 水下两版 -->
                <g id="takaBody">
                    <use href="#arms"/>
                    <use href="#legs"/>
                    <use href="#bodyShell"/>
                    <ellipse cx="110" cy="198" rx="52" ry="6" fill="#000" opacity="0.28"/>
                </g>
                <g id="takaBodySwim">
                    <use href="#arms"/>
                    <use href="#legsStub"/>
                    <use href="#bodyShell"/>
                    <ellipse cx="110" cy="182" rx="36" ry="5" fill="#000" opacity="0.18"/>
                </g>
            </defs>
            <g class="takaBody"><use href="#takaBody"/></g>
            <circle class="eyeGlow" cx="110" cy="92" r="17" fill="url(#eyeGrad)"/>
            <circle class="eyeHi" cx="103.5" cy="85.5" r="3.5" fill="#fff" opacity="0.85"/>
        </svg>
    </div>

    <div class="dialog" id="dialog">
        <div class="speaker" id="speaker-label">塔 卡</div>
        <div class="story-text" id="story-text"></div>
        <div class="listen-bar" id="listen-bar">
            <span data-i18n="engine.listen_bar">风声。呼呼。正在收听...</span>
            <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
        </div>
        <div class="choices" id="choices"></div>
    </div>

    <!-- 全局语音输入悬浮钮（FAB）：吸附屏幕右下角，远离文字区（2026-09-01 Mate 60 误触治理） -->
    <button class="mic-fab" id="mic-fab" hidden aria-label="语音输入"></button>

    <!-- 横屏绘本舞台：book-mode 时由 book.ts 填充 spread 双页（显隐由 CSS 管，不用 hidden） -->
    <div id="book-stage"></div>
</div>

<!-- 窄屏进故事的横屏提示（可勾不再提示） -->
<div class="rotate-hint" id="rotate-hint" hidden>
    <div class="rh-card">
        <div class="rh-phone" aria-hidden="true"></div>
        <div class="rh-text" data-i18n="book.hint_title">横过来，故事会更好看</div>
        <button class="rh-ok" id="rh-ok" data-i18n="book.hint_ok">知道了，继续</button>
        <label class="rh-never"><input type="checkbox" id="rh-never"> <span data-i18n="book.hint_never">不再提示</span></label>
    </div>
</div>

<!-- 如我所书（2026-08-19）：我的书架全屏浮层 -->
<div class="archive-overlay" id="archive-overlay" hidden>
    <div class="archive-panel">
        <div class="archive-head">
            <span class="archive-title" data-i18n="archive.title">如 我 所 书</span>
            <button class="archive-close" id="archive-close">✕</button>
        </div>
        <div class="archive-body" id="archive-body"></div>
    </div>
</div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
