<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>塔卡 (TAKA) - 第一次听见风声</title>
    <style>
        :root {
            --bg-deep: #0a141f;
            --bg-sea: #13283a;
            --bg-dialog: rgba(8,14,20,.88);
            --border: #2d3a4a;
            --text-primary: #e2e8f0;
            --text-secondary: #8d99a8;
            --accent-warm: #ffb703;
            --accent-dim: #cca025;
            --choice-bg: #182432;
            --choice-border: #3d4c5e;
            --ok-green: #48bb78;
            --low-orange: #c77b1e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: linear-gradient(180deg, var(--bg-deep) 0%, var(--bg-sea) 100%);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        #stage {
            position: relative;
            width: 100%;
            height: 100vh;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* HUD：右上角，极小，不抢眼 */
        .hud {
            position: absolute;
            top: 14px;
            right: 20px;
            font-size: 11px;
            color: var(--text-secondary);
            letter-spacing: 2px;
        }

        /* 立绘：偏左中 */
        .taka-figure {
            position: absolute;
            left: 12%;
            top: 10%;
        }
        .taka-figure svg { height: 300px; display: block; }

        /* 对话框：纯文本 */
        .dialog {
            position: absolute;
            left: 24px;
            right: 24px;
            bottom: 24px;
            background: var(--bg-dialog);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px 20px;
            min-height: 110px;
        }

        .speaker {
            font-size: 11px;
            color: var(--accent-dim);
            letter-spacing: 4px;
            margin-bottom: 8px;
        }

        .story-text {
            font-size: 17px;
            line-height: 2;
            letter-spacing: 1px;
            color: var(--text-primary);
            white-space: pre-line;
            min-height: 68px;
            cursor: pointer;
        }

        /* 选项：浮于对话框上方右侧（右手拇指热区） */
        .choices {
            position: absolute;
            right: 32px;
            bottom: 170px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-width: 200px;
        }

        .choice-btn {
            min-height: 40px;
            padding: 10px 16px;
            border-radius: 12px;
            border: 1px solid var(--choice-border);
            background: var(--choice-bg);
            color: var(--text-primary);
            font-size: 15px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0,0,0,.4);
            transition: all .15s ease;
            animation: choiceIn .3s ease;
        }
        .choice-btn:hover {
            border-color: var(--accent-warm);
            transform: translateY(-2px);
        }
        @keyframes choiceIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 聆听分支进度条 */
        .listen-bar {
            display: none;
            flex-direction: column;
            gap: 10px;
            margin-top: 12px;
        }
        .listen-bar span {
            font-size: 12px;
            color: var(--text-secondary);
            letter-spacing: 3px;
        }
        .progress-track {
            width: 100%;
            height: 4px;
            background: var(--choice-bg);
            border-radius: 2px;
            overflow: hidden;
        }
        .progress-fill {
            width: 0%;
            height: 100%;
            background: var(--accent-dim);
        }
    </style>
</head>
<body>

<div id="stage">
    <div class="hud">ENERGY <span id="battery-text">100%</span></div>

    <div class="taka-figure st-standby" id="taka-figure">
        <!-- Task 2: SVG 立绘 -->
    </div>

    <div class="choices" id="choices"></div>

    <div class="dialog" id="dialog">
        <div class="speaker">塔 卡</div>
        <div class="story-text" id="story-text"></div>
        <div class="listen-bar" id="listen-bar">
            <span>风声。呼呼。正在收听...</span>
            <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
        </div>
    </div>
</div>

<script>
// Task 3: 故事数据 + 引擎
</script>

</body>
</html>
