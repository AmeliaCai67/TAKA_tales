<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>塔卡 (Taka) - 交互叙事原型</title>
    <style>
        :root {
            --bg-color: #080c10;
            --panel-bg: #141a22;
            --metal-border: #3a4454;
            --text-color: #e2e8f0;
            --eye-glow: #ffb703;
            --eye-dim: #cca025;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
        }

        /* 模拟塔卡胸腔/屏幕的金属外壳 */
        .taka-frame {
            width: 100%;
            max-width: 540px;
            background: var(--panel-bg);
            border: 4px solid var(--metal-border);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 0 20px rgba(0,0,0,0.6);
            position: relative;
        }

        /* 手绘草图中的螺母装饰线条 */
        .taka-frame::before {
            content: "⬡  ⬡  ⬡  ⬡  ⬡  ⬡  ⬡";
            position: absolute;
            top: 6px;
            left: 0;
            right: 0;
            text-align: center;
            color: #2d3748;
            font-size: 12px;
            letter-spacing: 24px;
            text-indent: 24px;
        }
        .taka-frame::after {
            content: "⬡  ⬡  ⬡  ⬡  ⬡  ⬡  ⬡";
            position: absolute;
            bottom: 6px;
            left: 0;
            right: 0;
            text-align: center;
            color: #2d3748;
            font-size: 12px;
            letter-spacing: 24px;
            text-indent: 24px;
        }

        /* 状态栏：电量与核心组件 */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #718096;
            margin-bottom: 25px;
            border-bottom: 1px dashed #2d3748;
            padding-bottom: 10px;
        }

        .battery-container {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .battery-bar {
            width: 40px;
            height: 12px;
            border: 1px solid #4a5568;
            padding: 1px;
            border-radius: 2px;
        }

        .battery-fill {
            height: 100%;
            background-color: #48bb78;
            width: 100%;
            transition: width 0.5s ease, background-color 0.5s ease;
        }

        .battery-fill.low {
            background-color: #f56565;
            animation: battery-blink 1s infinite alternate;
        }

        /* 居中内凹的摄像头大眼睛 */
        .eye-container {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }

        .taka-eye {
            width: 50px;
            height: 50px;
            background: radial-gradient(circle, #fff 10%, var(--eye-glow) 50%, var(--eye-dim) 100%);
            border-radius: 50%;
            border: 3px solid #2d3748;
            box-shadow: 0 0 15px var(--eye-glow), inset 0 2px 5px rgba(0,0,0,0.5);
            animation: eye-breath 3s infinite alternate ease-in-out;
            transition: all 0.5s ease;
        }

        .taka-eye.off {
            background: #1a202c;
            border-color: #1a202c;
            box-shadow: none;
            animation: none;
        }

        .taka-eye.blink-fast {
            animation: eye-blink-fast 0.3s infinite alternate;
        }

        /* 叙事文本展示区 */
        .story-container {
            min-height: 140px;
            margin-bottom: 30px;
        }

        .story-text {
            font-size: 16px;
            line-height: 2;
            letter-spacing: 2px;
            white-space: pre-line;
            color: var(--text-color);
            opacity: 0;
            transform: translateY(10px);
            animation: fadeInText 0.6s forwards ease-out;
        }

        /* 交互选择按钮 */
        .choices-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .choice-btn {
            background: none;
            border: 1px solid #4a5568;
            color: #a0aec0;
            padding: 14px 20px;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            font-size: 14px;
            letter-spacing: 1px;
            transition: all 0.2s ease;
        }

        .choice-btn:hover {
            background: #1a2332;
            border-color: var(--eye-glow);
            color: #fff;
            padding-left: 25px;
        }

        /* 聆听沉默状态的进度条 */
        .listen-overlay {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-top: 20px;
        }
        .progress-track {
            width: 100%;
            height: 4px;
            background: #1a202c;
            border-radius: 2px;
            overflow: hidden;
        }
        .progress-bar {
            width: 0%;
            height: 100%;
            background: var(--eye-glow);
        }

        /* 动画定义 */
        @keyframes eye-breath {
            0% { box-shadow: 0 0 10px var(--eye-dim); }
            100% { box-shadow: 0 0 25px var(--eye-glow); }
        }

        @keyframes eye-blink-fast {
            0% { opacity: 0.3; box-shadow: 0 0 5px var(--eye-dim); }
            100% { opacity: 1; box-shadow: 0 0 20px var(--eye-glow); }
        }

        @keyframes battery-blink {
            0% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        @keyframes fadeInText {
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="taka-frame">
        <div class="status-bar">
            <span>MODEL: TAKA-M1</span>
            <div class="battery-container">
                <span>ENERGY</span>
                <div class="battery-bar">
                    <div id="battery-fill" class="battery-fill"></div>
                </div>
                <span id="battery-text">100%</span>
            </div>
        </div>

        <div class="eye-container">
            <div id="taka-eye" class="taka-eye"></div>
        </div>

        <div class="story-container">
            <div id="story-text" class="story-text"></div>
        </div>

        <div id="choices-container" class="choices-container"></div>

        <div id="listen-overlay" class="listen-overlay">
            <span style="font-size: 13px; color: #718096; letter-spacing: 4px;">风声。呼呼。正在收听...</span>
            <div class="progress-track">
                <div id="progress-bar" class="progress-bar"></div>
            </div>
        </div>
    </div>

    <script>
        // 纯静态叙事状态机数据
        const storyData = {
            start: {
                text: "海底很亮。有很多光。\n\n塔卡每天清理珊瑚。光在动。\n\n他听到声音。呼呼。从上面来。\n\n老机器说：\"不要去。上面没有水。\"\n\n塔卡的灯闪了一下：\"我想知道。\"",
                battery: 100,
                eyeClass: "",
                choices: [
                    { text: "A. 游上去看看", next: "surface" },
                    { text: "B. 继续清理珊瑚", next: "clean_branch" }
                ]
            },
            clean_branch: {
                text: "塔卡留下来清理珊瑚。\n\n夜里，他的灯一直亮着。他睡不着。\n\n呼呼。声音还在。\n\n第二天，塔卡放下了手里的铲子。",
                battery: 95,
                eyeClass: "blink-fast",
                choices: [
                    { text: "A. 还是上去看看吧", next: "surface" }
                ]
            },
            surface: {
                text: "塔卡浮出水面。没有水。很疼。\n\n但他听到了。风声。呼呼。\n\n一只海鸥飞过来：\"你会掉下去。\"\n\n塔卡：\"我在听。\"\n\n海鸥：\"听什么？\"\n\n塔卡：\"我不知道。但我想听完。\"",
                battery: 60,
                eyeClass: "",
                choices: [
                    { text: "A. 问风声：\"你从哪里来？\"", next: "ask_wind" },
                    { text: "B. 只是听（保持沉默）", next: "just_listen" }
                ]
            },
            ask_wind: {
                text: "塔卡问：\"你从哪里来？\"\n\n海鸥回答：\"我从有云的地方来。\"\n\n塔卡问：\"云是什么？\"\n\n海鸥说：\"云是天上的海，只是它抓不住。\"\n\n太阳渐渐升起来了。",
                battery: 45,
                eyeClass: "",
                choices: [
                    { text: "继续", next: "climax" }
                ]
            },
            just_listen: {
                text: "塔卡没有说话。他的灯光慢慢变亮。\n\n风声变得很清晰。呼呼。呼呼。\n\n没有问题。只有风。",
                battery: 40,
                eyeClass: "",
                isSpecialListen: true, // 触发专属的沉默聆听交互
                next: "climax"
            },
            climax: {
                text: "太阳出来了。塔卡的电池只剩 10%。\n\n老机器的信号很弱：\"回来。现在。\"\n\n塔卡看着海面。风声还在。\n\n海鸥说：\"你选。我不帮你选。\"\n\n塔卡的灯闪了三次。",
                battery: 10,
                eyeClass: "blink-fast",
                choices: [
                    { text: "A. 回海底充电（安全，但听不到风声了）", next: "ending_a" },
                    { text: "B. 再听一分钟（可能关机，但听到了完整的歌）", next: "ending_b" }
                ]
            },
            ending_a: {
                text: "塔卡沉入海底。他接上了充电线。\n\n他把风声录进了记忆库。\n\n第二天，他带着满电回来，放给老机器听。\n\n老机器的灯第一次闪了：\"原来是这样。\"\n\n（完 - 分享而非牺牲）",
                battery: 100,
                eyeClass: "",
                choices: [
                    { text: "重新开始故事", next: "start" }
                ]
            },
            ending_b: {
                text: "塔卡没有动。一分钟。两分钟。\n\n他听到了完整的一首歌。\n\n咔哒。塔卡关机了。\n\n海鸥用巨大的翅膀，一点点把他推回了海面。\n\n他在日落时醒来。电池 0%。但记忆里有完整的风声。\n\n\"值了。\" 他身边坐着海鸥。\n\n（完 - 体验优先，有友兜底）",
                battery: 0,
                eyeClass: "off",
                choices: [
                    { text: "重新开始故事", next: "start" }
                ]
            }
        };

        // 核心渲染逻辑
        function renderScene(sceneKey) {
            const scene = storyData[sceneKey];
            if (!scene) return;

            // 1. 更新电量显示与样式
            const fill = document.getElementById("battery-fill");
            const text = document.getElementById("battery-text");
            fill.style.width = scene.battery + "%";
            text.innerText = scene.battery + "%";
            if (scene.battery <= 10) {
                fill.className = "battery-fill low";
            } else {
                fill.className = "battery-fill";
            }

            // 2. 更新摄像头眼睛状态
            const eye = document.getElementById("taka-eye");
            eye.className = "taka-eye " + scene.eyeClass;

            // 3. 渲染故事文本（带重新触发动画效果）
            const textContainer = document.getElementById("story-text");
            textContainer.style.animation = 'none';
            textContainer.offsetHeight; /* 触发重绘 */
            textContainer.style.animation = null;
            textContainer.innerText = scene.text;

            // 4. 渲染交互组件
            const choicesContainer = document.getElementById("choices-container");
            const listenOverlay = document.getElementById("listen-overlay");
            
            choicesContainer.innerHTML = "";
            listenOverlay.style.display = "none";

            // 判断是否是海明威式的“静静聆听”分支
            if (scene.isSpecialListen) {
                listenOverlay.style.display = "flex";
                const progressBar = document.getElementById("progress-bar");
                progressBar.style.width = "0%";
                
                // 模拟一个 4 秒的动态聆听静音过程（用于原型体验，实际可拉长）
                let progress = 0;
                const interval = setInterval(() => {
                    progress += 2;
                    progressBar.style.width = progress + "%";
                    if (progress >= 100) {
                        clearInterval(interval);
                        // 聆听结束后，自动吐出“继续”按钮
                        choicesContainer.innerHTML = `<button class="choice-btn" onclick="renderScene('${scene.next}')">睁开眼睛，太阳升起来了...</button>`;
                    }
                }, 80);
            } else {
                // 普通选择支渲染
                scene.choices.forEach(choice => {
                    const btn = document.createElement("button");
                    btn.className = "choice-btn";
                    btn.innerText = choice.text;
                    btn.onclick = () => renderScene(choice.next);
                    choicesContainer.appendChild(btn);
                });
            }
        }

        // 初始化启动
        renderScene("start");
    </script>
</body>
</html>
