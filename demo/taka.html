<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>塔卡 (TAKA) - 第一次听见风声</title>
    <style>
        :root {
            --bg-deep: #0a141f;
            --bg-sea: #13283a;
            --bg-dialog: rgba(8,14,20,.88);
            --border: #2d3a4a;
            --text-primary: #e2e8f0;
            --text-secondary: #8d99a8;
            --accent-warm: #ffb703;
            --accent-dim: #cca025;
            --choice-bg: #182432;
            --choice-border: #3d4c5e;
            --ok-green: #48bb78;
            --low-orange: #c77b1e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: linear-gradient(180deg, var(--bg-deep) 0%, var(--bg-sea) 100%);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        #stage {
            position: relative;
            width: 100%;
            height: 100vh;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* HUD：右上角，极小，不抢眼 */
        .hud {
            position: absolute;
            top: 14px;
            right: 20px;
            font-size: 11px;
            color: var(--text-secondary);
            letter-spacing: 2px;
        }

        /* 立绘：偏左中 */
        .taka-figure {
            position: absolute;
            left: 12%;
            top: 10%;
        }
        .taka-figure svg { height: 300px; display: block; }

        /* 对话框：纯文本 */
        .dialog {
            position: absolute;
            left: 24px;
            right: 24px;
            bottom: 24px;
            background: var(--bg-dialog);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px 20px;
            min-height: 110px;
        }

        .speaker {
            font-size: 11px;
            color: var(--accent-dim);
            letter-spacing: 4px;
            margin-bottom: 8px;
        }

        .story-text {
            font-size: 17px;
            line-height: 2;
            letter-spacing: 1px;
            color: var(--text-primary);
            white-space: pre-line;
            min-height: 68px;
            cursor: pointer;
        }

        /* 选项：浮于对话框上方右侧（右手拇指热区） */
        .choices {
            position: absolute;
            right: 32px;
            bottom: 170px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-width: 200px;
        }

        .choice-btn {
            min-height: 40px;
            padding: 10px 16px;
            border-radius: 12px;
            border: 1px solid var(--choice-border);
            background: var(--choice-bg);
            color: var(--text-primary);
            font-size: 15px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0,0,0,.4);
            transition: all .15s ease;
            animation: choiceIn .3s ease;
        }
        .choice-btn:hover {
            border-color: var(--accent-warm);
            transform: translateY(-2px);
        }
        @keyframes choiceIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 聆听分支进度条 */
        .listen-bar {
            display: none;
            flex-direction: column;
            gap: 10px;
            margin-top: 12px;
        }
        .listen-bar span {
            font-size: 12px;
            color: var(--text-secondary);
            letter-spacing: 3px;
        }
        .progress-track {
            width: 100%;
            height: 4px;
            background: var(--choice-bg);
            border-radius: 2px;
            overflow: hidden;
        }
        .progress-fill {
            width: 0%;
            height: 100%;
            background: var(--accent-dim);
        }

        /* ===== 塔卡 6 态灯光（动画只作用在眼睛的光上） ===== */
        .eyeGlow { transform-box: fill-box; transform-origin: center; }

        .st-standby .eyeGlow { animation: breathe 3.2s infinite alternate ease-in-out; }
        @keyframes breathe {
            from { opacity: .55; filter: drop-shadow(0 0 2px rgba(255,183,3,.4)); }
            to   { opacity: 1;   filter: drop-shadow(0 0 7px rgba(255,183,3,.8)); }
        }

        .st-speaking .eyeGlow { opacity: 1; filter: drop-shadow(0 0 9px rgba(255,183,3,.95)); }
        .st-speaking .takaBody { animation: bob 1.6s infinite ease-in-out; transform-box: fill-box; transform-origin: center; }
        @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

        .st-thinking .eyeGlow { animation: think 2.4s infinite; }
        @keyframes think {
            0% { opacity: 1; } 6% { opacity: .15; } 12% { opacity: 1; }
            18% { opacity: .15; } 24% { opacity: 1; } 30% { opacity: .15; }
            36% { opacity: 1; } 100% { opacity: 1; }
        }

        .st-listening .eyeGlow { animation: listen 4.5s infinite ease-in-out; }
        @keyframes listen {
            0%,100% { opacity: .35; filter: drop-shadow(0 0 1px rgba(255,183,3,.3)); }
            50%     { opacity: .8;  filter: drop-shadow(0 0 5px rgba(255,183,3,.6)); }
        }

        .st-low .eyeGlow { fill: var(--low-orange); animation: low 2s infinite; }
        @keyframes low { 0%,100% { opacity: .3; } 50% { opacity: .65; } }

        .st-off .takaBody { transform: rotate(-3deg); transform-box: fill-box; transform-origin: center; opacity: .75; }
        .st-off .eyeGlow { display: none; }
    </style>
</head>
<body>

<div id="stage">
    <div class="hud">ENERGY <span id="battery-text">100%</span></div>

    <div class="taka-figure st-standby" id="taka-figure">
        <svg viewBox="0 0 220 210">
            <defs>
                <linearGradient id="metalGrad" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0" stop-color="#b3bdc9"/>
                    <stop offset="0.55" stop-color="#7d8896"/>
                    <stop offset="1" stop-color="#5d6875"/>
                </linearGradient>
                <radialGradient id="eyeGrad" cx="0.5" cy="0.45" r="0.6">
                    <stop offset="0" stop-color="#fff6d8"/>
                    <stop offset="0.55" stop-color="#ffb703"/>
                    <stop offset="1" stop-color="#9c7108"/>
                </radialGradient>
                <!-- 螺钉 9 颗：上 3、下 2（角落）、两侧各 2 -->
                <g id="nutRing" fill="#525d6b" stroke="#39424e">
                    <polygon points="77.5,55 75.25,58.9 70.75,58.9 68.5,55 70.75,51.1 75.25,51.1"/>
                    <polygon points="114.5,55 112.25,58.9 107.75,58.9 105.5,55 107.75,51.1 112.25,51.1"/>
                    <polygon points="151.5,55 149.25,58.9 144.75,58.9 142.5,55 144.75,51.1 149.25,51.1"/>
                    <polygon points="77.5,140 75.25,143.9 70.75,143.9 68.5,140 70.75,136.1 75.25,136.1"/>
                    <polygon points="69.5,72 67.25,75.9 62.75,75.9 60.5,72 62.75,68.1 67.25,68.1"/>
                    <polygon points="69.5,112 67.25,115.9 62.75,115.9 60.5,112 62.75,108.1 67.25,108.1"/>
                    <polygon points="159.5,72 157.25,75.9 152.75,75.9 150.5,72 152.75,68.1 157.25,68.1"/>
                    <polygon points="159.5,112 157.25,115.9 152.75,115.9 150.5,112 152.75,108.1 157.25,108.1"/>
                </g>
                <!-- 松动带锈的一颗：前面板右下角，正面专属 -->
                <g id="rustNut" transform="rotate(20 147 140)">
                    <polygon points="151.5,140 149.25,143.9 144.75,143.9 142.5,140 144.75,136.1 149.25,136.1" fill="#6b5335" stroke="#8a4b2a"/>
                </g>
                <!-- 双臂：链条 3 节 + 喇叭口 -->
                <g id="arms">
                    <circle cx="50" cy="115" r="4.5" fill="none" stroke="#6b7686" stroke-width="2.5"/>
                    <circle cx="43" cy="125" r="4.5" fill="none" stroke="#6b7686" stroke-width="2.5"/>
                    <circle cx="39" cy="136" r="4.5" fill="none" stroke="#6b7686" stroke-width="2.5"/>
                    <path d="M37 139 L27 154 Q35 162 44 155 L40.5 142 Z" fill="#525d6b" stroke="#39424e" stroke-width="1.5"/>
                    <circle cx="170" cy="115" r="4.5" fill="none" stroke="#6b7686" stroke-width="2.5"/>
                    <circle cx="177" cy="125" r="4.5" fill="none" stroke="#6b7686" stroke-width="2.5"/>
                    <circle cx="181" cy="136" r="4.5" fill="none" stroke="#6b7686" stroke-width="2.5"/>
                    <path d="M183 139 L193 154 Q185 162 176 155 L179.5 142 Z" fill="#525d6b" stroke="#39424e" stroke-width="1.5"/>
                </g>
                <!-- 伸缩腿：陆地模式（伸出） -->
                <g id="legs">
                    <rect x="80" y="145" width="10" height="16" fill="#525d6b" stroke="#39424e"/>
                    <rect x="81.5" y="159" width="7" height="18" fill="#414b58" stroke="#39424e" stroke-width="1"/>
                    <rect x="72" y="176" width="26" height="9" rx="4.5" fill="#39424e"/>
                    <rect x="130" y="145" width="10" height="16" fill="#525d6b" stroke="#39424e"/>
                    <rect x="131.5" y="159" width="7" height="18" fill="#414b58" stroke="#39424e" stroke-width="1"/>
                    <rect x="122" y="176" width="26" height="9" rx="4.5" fill="#39424e"/>
                </g>
                <!-- 伸缩腿：水下模式（收回贴腹，备用） -->
                <g id="legsStub">
                    <rect x="80" y="145" width="10" height="8" fill="#525d6b" stroke="#39424e"/>
                    <rect x="130" y="145" width="10" height="8" fill="#525d6b" stroke="#39424e"/>
                </g>
                <!-- 机体壳：身体 + 螺钉 + 眼睛外环 + 胸口面板（不含眼睛的光） -->
                <g id="bodyShell">
                    <rect x="60" y="50" width="100" height="95" rx="9" fill="url(#metalGrad)" stroke="#414b58" stroke-width="2"/>
                    <use href="#nutRing"/>
                    <use href="#rustNut"/>
                    <circle cx="110" cy="92" r="27" fill="#18212b" stroke="#39424e" stroke-width="3"/>
                    <rect x="88" y="124" width="44" height="13" rx="4" fill="#414b58" opacity="0.65"/>
                    <circle cx="97" cy="130.5" r="2" fill="#48bb78"/>
                    <circle cx="106" cy="130.5" r="2" fill="#718096"/>
                    <circle cx="115" cy="130.5" r="2" fill="#718096"/>
                </g>
                <!-- 完整个体：陆地 / 水下两版 -->
                <g id="takaBody">
                    <use href="#arms"/>
                    <use href="#legs"/>
                    <use href="#bodyShell"/>
                    <ellipse cx="110" cy="198" rx="52" ry="6" fill="#000" opacity="0.28"/>
                </g>
                <g id="takaBodySwim">
                    <use href="#arms"/>
                    <use href="#legsStub"/>
                    <use href="#bodyShell"/>
                    <ellipse cx="110" cy="182" rx="36" ry="5" fill="#000" opacity="0.18"/>
                </g>
            </defs>
            <g class="takaBody"><use href="#takaBody"/></g>
            <circle class="eyeGlow" cx="110" cy="92" r="17" fill="url(#eyeGrad)"/>
            <circle cx="103.5" cy="85.5" r="3.5" fill="#fff" opacity="0.85"/>
        </svg>
    </div>

    <div class="choices" id="choices"></div>

    <div class="dialog" id="dialog">
        <div class="speaker">塔 卡</div>
        <div class="story-text" id="story-text"></div>
        <div class="listen-bar" id="listen-bar">
            <span>风声。呼呼。正在收听...</span>
            <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
        </div>
    </div>
</div>

<script>
    // 故事数据：文本与分支逻辑保持原样，仅增加 eyeState / endState 字段
    const storyData = {
        start: {
            text: "海底很亮。有很多光。\n\n塔卡每天清理珊瑚。光在动。\n\n他听到声音。呼呼。从上面来。\n\n老机器说：\"不要去。上面没有水。\"\n\n塔卡的灯闪了一下：\"我想知道。\"",
            battery: 100,
            eyeState: "st-standby",
            choices: [
                { text: "A. 游上去看看", next: "surface" },
                { text: "B. 继续清理珊瑚", next: "clean_branch" }
            ]
        },
        clean_branch: {
            text: "塔卡留下来清理珊瑚。\n\n夜里，他的灯一直亮着。他睡不着。\n\n呼呼。声音还在。\n\n第二天，塔卡放下了手里的铲子。",
            battery: 95,
            eyeState: "st-thinking",
            choices: [
                { text: "A. 还是上去看看吧", next: "surface" }
            ]
        },
        surface: {
            text: "塔卡浮出水面。没有水。很疼。\n\n但他听到了。风声。呼呼。\n\n一只海鸥飞过来：\"你会掉下去。\"\n\n塔卡：\"我在听。\"\n\n海鸥：\"听什么？\"\n\n塔卡：\"我不知道。但我想听完。\"",
            battery: 60,
            eyeState: "st-standby",
            choices: [
                { text: "A. 问风声：\"你从哪里来？\"", next: "ask_wind" },
                { text: "B. 只是听（保持沉默）", next: "just_listen" }
            ]
        },
        ask_wind: {
            text: "塔卡问：\"你从哪里来？\"\n\n海鸥回答：\"我从有云的地方来。\"\n\n塔卡问：\"云是什么？\"\n\n海鸥说：\"云是天上的海，只是它抓不住。\"\n\n太阳渐渐升起来了。",
            battery: 45,
            eyeState: "st-standby",
            choices: [
                { text: "继续", next: "climax" }
            ]
        },
        just_listen: {
            text: "塔卡没有说话。他的灯光慢慢变亮。\n\n风声变得很清晰。呼呼。呼呼。\n\n没有问题。只有风。",
            battery: 40,
            eyeState: "st-listening",
            isSpecialListen: true,
            next: "climax"
        },
        climax: {
            text: "太阳出来了。塔卡的电池只剩 10%。\n\n老机器的信号很弱：\"回来。现在。\"\n\n塔卡看着海面。风声还在。\n\n海鸥说：\"你选。我不帮你选。\"\n\n塔卡的灯闪了三次。",
            battery: 10,
            eyeState: "st-low",
            choices: [
                { text: "A. 回海底充电（安全，但听不到风声了）", next: "ending_a" },
                { text: "B. 再听一分钟（可能关机，但听到了完整的歌）", next: "ending_b" }
            ]
        },
        ending_a: {
            text: "塔卡沉入海底。他接上了充电线。\n\n他把风声录进了记忆库。\n\n第二天，他带着满电回来，放给老机器听。\n\n老机器的灯第一次闪了：\"原来是这样。\"\n\n（完 - 分享而非牺牲）",
            battery: 100,
            eyeState: "st-standby",
            choices: [
                { text: "重新开始故事", next: "start" }
            ]
        },
        ending_b: {
            text: "塔卡没有动。一分钟。两分钟。\n\n他听到了完整的一首歌。\n\n咔哒。塔卡关机了。\n\n海鸥用巨大的翅膀，一点点把他推回了海面。\n\n他在日落时醒来。电池 0%。但记忆里有完整的风声。\n\n\"值了。\" 他身边坐着海鸥。\n\n（完 - 体验优先，有友兜底）",
            battery: 0,
            eyeState: "st-standby",
            endState: "st-off",
            choices: [
                { text: "重新开始故事", next: "start" }
            ]
        }
    };

    let typing = null; // 打字机 timer

    function setFigureState(state) {
        document.getElementById("taka-figure").className = "taka-figure " + state;
    }

    function typeText(text, onDone) {
        const el = document.getElementById("story-text");
        el.innerText = "";
        let i = 0;
        clearInterval(typing);
        typing = setInterval(() => {
            el.innerText = text.slice(0, ++i);
            if (i >= text.length) { clearInterval(typing); typing = null; onDone(); }
        }, 45);
        // 点击对话框立即补完
        document.getElementById("dialog").onclick = () => {
            if (typing) { clearInterval(typing); typing = null; el.innerText = text; onDone(); }
        };
    }

    function showChoices(scene) {
        const box = document.getElementById("choices");
        box.innerHTML = "";
        (scene.choices || []).forEach(c => {
            const btn = document.createElement("button");
            btn.className = "choice-btn";
            btn.innerText = c.text;
            btn.onclick = () => renderScene(c.next);
            box.appendChild(btn);
        });
    }

    function runListenBar(next) {
        const bar = document.getElementById("listen-bar");
        const fill = document.getElementById("progress-fill");
        bar.style.display = "flex";
        fill.style.width = "0%";
        let p = 0;
        const t = setInterval(() => {
            fill.style.width = (p += 2) + "%";
            if (p >= 100) {
                clearInterval(t);
                document.getElementById("choices").innerHTML =
                    `<button class="choice-btn" onclick="renderScene('${next}')">睁开眼睛，太阳升起来了...</button>`;
            }
        }, 80);
    }

    function renderScene(key) {
        const scene = storyData[key];
        if (!scene) return;
        document.getElementById("choices").innerHTML = "";
        document.getElementById("listen-bar").style.display = "none";
        document.getElementById("battery-text").innerText = scene.battery + "%";

        // 打字机期间 standby 临时切 speaking（spec §7）；特殊状态不被打断
        const duringTyping = scene.eyeState === "st-standby" ? "st-speaking" : scene.eyeState;
        setFigureState(duringTyping);

        typeText(scene.text, () => {
            setFigureState(scene.endState || scene.eyeState);
            if (scene.isSpecialListen) {
                runListenBar(scene.next);
            } else if (scene.choices && !scene.endState) {
                // 思考预告：闪三下（约 0.9s）再浮出选项
                const prev = scene.eyeState;
                setFigureState("st-thinking");
                setTimeout(() => { setFigureState(prev); showChoices(scene); }, 900);
            } else {
                showChoices(scene); // endState 场景（结局 B）直接给「重新开始」
            }
        });
    }

    renderScene("start");
</script>

</body>
</html>
