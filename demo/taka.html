<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>塔卡 (TAKA) - 第一次听见风声</title>
    <style>
        :root {
            --bg-deep: #0a141f;
            --bg-sea: #13283a;
            --bg-dialog: rgba(8,14,20,.88);
            --border: #2d3a4a;
            --text-primary: #e2e8f0;
            --text-secondary: #8d99a8;
            --accent-warm: #ffb703;
            --accent-dim: #cca025;
            --choice-bg: #182432;
            --choice-border: #3d4c5e;
            --ok-green: #48bb78;
            --low-orange: #c77b1e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: linear-gradient(180deg, var(--bg-deep) 0%, var(--bg-sea) 100%);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        #stage {
            position: relative;
            width: 100%;
            height: 100vh;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* HUD：右上角，极小，不抢眼 */
        .hud {
            position: absolute;
            top: 14px;
            right: 20px;
            font-size: 11px;
            color: var(--text-secondary);
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 电量条：小电池图标，填充随档位变色 */
        .battery-icon {
            width: 34px;
            height: 13px;
            border: 1px solid var(--text-secondary);
            border-radius: 3px;
            position: relative;
            padding: 1px;
        }
        .battery-icon::after {  /* 电池正极凸起 */
            content: "";
            position: absolute;
            right: -4px;
            top: 3px;
            width: 3px;
            height: 5px;
            background: var(--text-secondary);
            border-radius: 0 1px 1px 0;
        }
        .battery-fill {
            height: 100%;
            width: 100%;
            background: var(--ok-green);
            border-radius: 1px;
            transition: width .4s ease, background .4s ease;
        }

        /* 设置按钮：左上角，与右上 HUD 对称 */
        .settings-btn {
            position: absolute;
            top: 10px;
            left: 14px;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 15px;
            cursor: pointer;
            opacity: .7;
            z-index: 30;
        }
        .settings-btn:hover { opacity: 1; }

        /* 语音开关：左上角，🏅 右邻 */
        .speech-btn {
            position: absolute;
            top: 10px;
            left: 74px;
            background: none;
            border: none;
            font-size: 15px;
            cursor: pointer;
            opacity: .7;
            z-index: 30;
        }
        .speech-btn:hover { opacity: 1; }

        /* 成就按钮：左上角，⚙ 与 🔊 之间 */
        .ach-btn {
            position: absolute;
            top: 10px;
            left: 44px;
            background: none;
            border: none;
            font-size: 15px;
            cursor: pointer;
            opacity: .7;
            z-index: 30;
        }
        .ach-btn:hover { opacity: 1; }

        /* 成就弹窗：遮罩 + 居中卡片，点遮罩关闭 */
        .ach-overlay {
            position: absolute;
            inset: 0;
            background: rgba(4,8,12,.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 40;
        }
        .ach-overlay[hidden] { display: none; }
        .ach-modal {
            width: 300px;
            background: var(--bg-dialog);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 18px 22px;
            box-shadow: 0 8px 30px rgba(0,0,0,.5);
        }
        .am-title { font-size: 12px; letter-spacing: 4px; color: var(--text-primary); margin-bottom: 12px; }
        .ach-item { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 12px; }
        .ach-item:last-child { margin-bottom: 0; }
        .ach-item .ach-icon { font-size: 18px; line-height: 1.4; }
        .ach-item .ach-name { font-size: 14px; color: var(--text-primary); letter-spacing: 1px; }
        .ach-item .ach-desc { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
        .ach-item.locked { opacity: .35; }
        .ach-item.locked .ach-icon { filter: grayscale(1); }

        .settings-panel {
            position: absolute;
            top: 36px;
            left: 14px;
            width: 260px;
            background: var(--bg-dialog);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 16px;
            z-index: 30;
            font-size: 12px;
            color: var(--text-secondary);
        }
        .settings-panel .sp-title { font-size: 12px; letter-spacing: 3px; margin-bottom: 10px; color: var(--text-primary); }
        .settings-panel label { display: block; margin-bottom: 8px; letter-spacing: 1px; }
        .settings-panel input[type="text"],
        .settings-panel input[type="password"] {
            display: block;
            width: 100%;
            margin-top: 4px;
            padding: 6px 8px;
            background: var(--choice-bg);
            border: 1px solid var(--choice-border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 12px;
        }
        .sp-toggle { display: flex; align-items: center; gap: 6px; }
        .settings-panel input[type="range"] { width: 100%; margin-top: 6px; accent-color: var(--accent-dim); }
        #sp-rate-val { float: right; color: var(--text-primary); }
        #sp-preview {
            width: 100%;
            min-height: 28px;
            margin: 4px 0 8px;
            border-radius: 8px;
            cursor: pointer;
            border: 1px solid var(--choice-border);
            background: var(--choice-bg);
            color: var(--text-secondary);
            font-size: 12px;
        }
        #sp-preview:hover { border-color: var(--accent-warm); }
        .sp-note { font-size: 11px; line-height: 1.7; opacity: .8; margin: 8px 0; }
        .sp-actions { display: flex; gap: 8px; }
        .sp-actions button {
            flex: 1;
            min-height: 30px;
            border-radius: 8px;
            cursor: pointer;
            border: 1px solid var(--choice-border);
            background: var(--choice-bg);
            color: var(--text-primary);
        }

        /* AI 状态提示：顶部居中，小字 */
        .ai-status {
            position: absolute;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            color: var(--text-secondary);
            letter-spacing: 2px;
            z-index: 25;
        }

        /* 启动门：Chrome/Safari 都要求用户手势后才能发声，把第一次点击变成仪式 */
        .start-gate {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: linear-gradient(180deg, var(--bg-deep) 0%, var(--bg-sea) 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            cursor: pointer;
        }
        .gate-eye {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: radial-gradient(circle at 45% 40%, #fff6d8 0%, var(--accent-warm) 55%, #9c7108 100%);
            animation: breathe 3.2s infinite alternate ease-in-out;
        }
        .gate-title { font-size: 22px; letter-spacing: 12px; color: var(--text-primary); }
        .gate-btn {
            min-height: 48px;
            padding: 14px 36px;
            border-radius: 14px;
            border: 1px solid var(--choice-border);
            background: var(--choice-bg);
            color: var(--text-primary);
            font-size: 17px;
            letter-spacing: 3px;
            cursor: pointer;
            animation: choiceIn .3s ease;
        }
        .gate-btn:hover { border-color: var(--accent-warm); }

        /* 成就 toast：顶部居中胶囊，解锁定弹出，附成就文案 */
        .toast {
            position: absolute;
            top: 48px;
            left: 50%;
            transform: translateX(-50%) translateY(-8px);
            background: var(--bg-dialog);
            border: 1px solid var(--accent-dim);
            color: var(--accent-warm);
            padding: 8px 18px;
            border-radius: 16px;
            font-size: 13px;
            letter-spacing: 2px;
            text-align: center;
            line-height: 1.8;
            opacity: 0;
            pointer-events: none;
            transition: all .3s ease;
            z-index: 25;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast .toast-desc { font-size: 11px; color: var(--text-secondary); letter-spacing: 1px; }

        /* 立绘：偏左中 */
        .taka-figure {
            position: absolute;
            left: 12%;
            top: 10%;
        }
        .taka-figure svg { height: 300px; display: block; }

        /* 对话框：纯文本。固定高度——文本再长也不顶跑选项，内部滚动 */
        .dialog {
            position: absolute;
            left: 24px;
            right: 24px;
            bottom: 24px;
            height: 220px;
            display: flex;
            flex-direction: column;
            background: var(--bg-dialog);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px 20px;
        }

        .speaker {
            font-size: 11px;
            color: var(--accent-dim);
            letter-spacing: 4px;
            margin-bottom: 8px;
        }

        .story-text {
            font-size: 17px;
            line-height: 2;
            letter-spacing: 1px;
            color: var(--text-primary);
            white-space: pre-line;
            flex: 1;
            min-height: 0;
            overflow-y: auto; /* 长文本内部滚动 */
            cursor: pointer;
        }
        .story-text::-webkit-scrollbar { width: 4px; }
        .story-text::-webkit-scrollbar-thumb { background: var(--choice-border); border-radius: 2px; }

        /* 选项：锚定对话框顶边浮起（右侧拇指热区）。
           作为 .dialog 子元素 + bottom:calc(100%+12px)，无论文本多长
           都浮在对话框上方，不会被对话框盖住（修复长文本场景选项不可点击） */
        .choices {
            position: absolute;
            right: 12px;
            bottom: calc(100% + 12px);
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-width: 200px;
            z-index: 10;
        }

        .choice-btn {
            min-height: 40px;
            padding: 10px 16px;
            border-radius: 12px;
            border: 1px solid var(--choice-border);
            background: var(--choice-bg);
            color: var(--text-primary);
            font-size: 15px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0,0,0,.4);
            transition: all .15s ease;
            animation: choiceIn .3s ease;
        }
        .choice-btn:hover {
            border-color: var(--accent-warm);
            transform: translateY(-2px);
        }
        @keyframes choiceIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 自由输入选项 C：虚线框区别于固定选项 */
        .choice-input {
            display: flex;
            align-items: center;
            gap: 6px;
            min-height: 40px;
            padding: 4px 6px 4px 14px;
            border: 1px dashed var(--choice-border);
            border-radius: 12px;
            background: var(--choice-bg);
            box-shadow: 0 4px 12px rgba(0,0,0,.4);
            animation: choiceIn .3s ease;
        }
        .choice-input input {
            flex: 1;
            min-width: 0;
            background: none;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 15px;
        }
        .choice-input input::placeholder {
            color: var(--text-secondary);
            letter-spacing: 2px;
        }
        .choice-input button {
            min-width: 32px;
            min-height: 32px;
            border-radius: 8px;
            border: 1px solid var(--choice-border);
            background: none;
            color: var(--text-secondary);
            font-size: 14px;
            cursor: pointer;
        }
        .choice-input button:hover { border-color: var(--accent-warm); }
        .choice-input button.recording {
            color: var(--accent-warm);
            border-color: var(--accent-warm);
            animation: micPulse 1.2s infinite;
        }
        @keyframes micPulse { 0%,100% { opacity: 1; } 50% { opacity: .5; } }

        /* 聆听分支进度条 */
        .listen-bar {
            display: none;
            flex-direction: column;
            gap: 10px;
            margin-top: 12px;
        }
        .listen-bar span {
            font-size: 12px;
            color: var(--text-secondary);
            letter-spacing: 3px;
        }
        .progress-track {
            width: 100%;
            height: 4px;
            background: var(--choice-bg);
            border-radius: 2px;
            overflow: hidden;
        }
        .progress-fill {
            width: 0%;
            height: 100%;
            background: var(--accent-dim);
        }

        /* ===== 塔卡 6 态灯光（动画只作用在眼睛的光上） ===== */
        .eyeGlow { transform-box: fill-box; transform-origin: center; }

        .st-standby .eyeGlow { animation: breathe 3.2s infinite alternate ease-in-out; }
        @keyframes breathe {
            from { opacity: .55; filter: drop-shadow(0 0 2px rgba(255,183,3,.4)); }
            to   { opacity: 1;   filter: drop-shadow(0 0 7px rgba(255,183,3,.8)); }
        }

        .st-speaking .eyeGlow { opacity: 1; filter: drop-shadow(0 0 9px rgba(255,183,3,.95)); }
        .st-speaking .takaBody { animation: bob 1.6s infinite ease-in-out; transform-box: fill-box; transform-origin: center; }
        @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

        .st-thinking .eyeGlow { animation: think 2.4s infinite; }
        @keyframes think {
            0% { opacity: 1; } 6% { opacity: .15; } 12% { opacity: 1; }
            18% { opacity: .15; } 24% { opacity: 1; } 30% { opacity: .15; }
            36% { opacity: 1; } 100% { opacity: 1; }
        }

        .st-listening .eyeGlow { animation: listen 4.5s infinite ease-in-out; }
        @keyframes listen {
            0%,100% { opacity: .35; filter: drop-shadow(0 0 1px rgba(255,183,3,.3)); }
            50%     { opacity: .8;  filter: drop-shadow(0 0 5px rgba(255,183,3,.6)); }
        }

        .st-low .eyeGlow { fill: var(--low-orange); animation: low 2s infinite; }
        @keyframes low { 0%,100% { opacity: .3; } 50% { opacity: .65; } }

        /* 关机（spec §5/§7）：缓缓进行——身体 1.2s 倾斜降透明，灯光 1.2s 渐灭 */
        .takaBody { transition: transform 1.2s ease, opacity 1.2s ease; }
        .eyeGlow, .eyeHi { transition: opacity 1.2s ease; }
        .st-off .takaBody { transform: rotate(-3deg); transform-box: fill-box; transform-origin: center; opacity: .75; }
        .st-off .eyeGlow, .st-off .eyeHi { opacity: 0; }

        /* ===== 竖屏降级：上下堆叠，选项通栏（低频场景） ===== */
        @media (orientation: portrait) {
            body { overflow: auto; }
            #stage {
                height: auto;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                padding: 16px;
            }
            .hud { position: static; align-self: flex-end; order: 0; }
            .taka-figure { position: static; order: 1; margin-top: 8px; }
            .taka-figure svg { height: 220px; }
            .dialog { position: static; order: 2; width: 100%; margin-top: 12px; height: auto; /* 竖屏选项在对话框内部文档流，高度自适应 */ }
            .story-text { flex: none; max-height: 34vh; /* 文本区单独限高，超长按需滚动 */ }
            /* 竖屏：选项收进对话框底部通栏（choices 是 dialog 子元素，static 即可） */
            .choices { position: static; width: 100%; min-width: 0; margin-top: 12px; }
            .choice-btn { width: 100%; }
        }
    </style>
</head>
<body>

<div id="stage">
    <div class="hud">
        <div class="battery-icon"><div class="battery-fill" id="battery-fill"></div></div>
        <span id="battery-text">100%</span>
    </div>

    <button class="settings-btn" id="settings-btn" title="设置">⚙</button>
    <button class="ach-btn" id="ach-btn" title="成就">🏅</button>
    <button class="speech-btn" id="speech-btn" title="语音开关">🔊</button>
    <div class="settings-panel" id="settings-panel" hidden>
        <div class="sp-title">设 置</div>
        <label>Base URL
            <input type="text" id="sp-baseurl" placeholder="https://api.openai.com/v1">
        </label>
        <label>API Key
            <input type="password" id="sp-key" placeholder="sk-...">
        </label>
        <label>Model
            <input type="text" id="sp-model" placeholder="gpt-4o-mini">
        </label>
        <label class="sp-toggle"><input type="checkbox" id="sp-enabled"> 启用 AI 场景生成</label>
        <label class="sp-toggle"><input type="checkbox" id="sp-readchoices"> 朗读选项（家长代读 / 大孩子可关）</label>
        <label>语速 <span id="sp-rate-val">0.95x</span>
            <input type="range" id="sp-rate" min="0.5" max="1.5" step="0.05" value="0.95">
        </label>
        <button id="sp-preview">▶ 试听语速</button>
        <div class="sp-note">仅保存在本地浏览器。兼容 OpenAI 格式：DeepSeek（api.deepseek.com，模型 deepseek-v4-flash）/ Kimi（api.moonshot.cn）均可。开场、高潮与结局为固定文案，AI 只生成中段场景。</div>
        <div class="sp-actions">
            <button id="sp-save">保存</button>
            <button id="sp-close">关闭</button>
        </div>
    </div>
    <div class="ai-status" id="ai-status"></div>

    <div class="start-gate" id="start-gate" hidden>
        <div class="gate-eye"></div>
        <div class="gate-title">塔 卡</div>
        <button class="gate-btn" id="gate-btn">点一下，听风声</button>
    </div>
    <div class="toast" id="toast"></div>

    <div class="ach-overlay" id="ach-overlay" hidden>
        <div class="ach-modal">
            <div class="am-title">成 就</div>
            <div id="ach-list"></div>
        </div>
    </div>

    <div class="taka-figure st-standby" id="taka-figure">
        <svg viewBox="0 0 220 210">
            <defs>
                <linearGradient id="metalGrad" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0" stop-color="#b3bdc9"/>
                    <stop offset="0.55" stop-color="#7d8896"/>
                    <stop offset="1" stop-color="#5d6875"/>
                </linearGradient>
                <radialGradient id="eyeGrad" cx="0.5" cy="0.45" r="0.6">
                    <stop offset="0" stop-color="#fff6d8"/>
                    <stop offset="0.55" stop-color="#ffb703"/>
                    <stop offset="1" stop-color="#9c7108"/>
                </radialGradient>
                <!-- 螺钉 9 颗：上 3、下 2（角落）、两侧各 2 -->
                <g id="nutRing" fill="#525d6b" stroke="#39424e">
                    <polygon points="77.5,55 75.25,58.9 70.75,58.9 68.5,55 70.75,51.1 75.25,51.1"/>
                    <polygon points="114.5,55 112.25,58.9 107.75,58.9 105.5,55 107.75,51.1 112.25,51.1"/>
                    <polygon points="151.5,55 149.25,58.9 144.75,58.9 142.5,55 144.75,51.1 149.25,51.1"/>
                    <polygon points="77.5,140 75.25,143.9 70.75,143.9 68.5,140 70.75,136.1 75.25,136.1"/>
                    <polygon points="69.5,72 67.25,75.9 62.75,75.9 60.5,72 62.75,68.1 67.25,68.1"/>
                    <polygon points="69.5,112 67.25,115.9 62.75,115.9 60.5,112 62.75,108.1 67.25,108.1"/>
                    <polygon points="159.5,72 157.25,75.9 152.75,75.9 150.5,72 152.75,68.1 157.25,68.1"/>
                    <polygon points="159.5,112 157.25,115.9 152.75,115.9 150.5,112 152.75,108.1 157.25,108.1"/>
                </g>
                <!-- 松动带锈的一颗：前面板右下角，正面专属 -->
                <g id="rustNut" transform="rotate(20 147 140)">
                    <polygon points="151.5,140 149.25,143.9 144.75,143.9 142.5,140 144.75,136.1 149.25,136.1" fill="#6b5335" stroke="#8a4b2a"/>
                </g>
                <!-- 双臂：链条 3 节 + 喇叭口 -->
                <g id="arms">
                    <circle cx="50" cy="115" r="4.5" fill="none" stroke="#6b7686" stroke-width="2.5"/>
                    <circle cx="43" cy="125" r="4.5" fill="none" stroke="#6b7686" stroke-width="2.5"/>
                    <circle cx="39" cy="136" r="4.5" fill="none" stroke="#6b7686" stroke-width="2.5"/>
                    <path d="M37 139 L27 154 Q35 162 44 155 L40.5 142 Z" fill="#525d6b" stroke="#39424e" stroke-width="1.5"/>
                    <circle cx="170" cy="115" r="4.5" fill="none" stroke="#6b7686" stroke-width="2.5"/>
                    <circle cx="177" cy="125" r="4.5" fill="none" stroke="#6b7686" stroke-width="2.5"/>
                    <circle cx="181" cy="136" r="4.5" fill="none" stroke="#6b7686" stroke-width="2.5"/>
                    <path d="M183 139 L193 154 Q185 162 176 155 L179.5 142 Z" fill="#525d6b" stroke="#39424e" stroke-width="1.5"/>
                </g>
                <!-- 伸缩腿：陆地模式（伸出） -->
                <g id="legs">
                    <rect x="80" y="145" width="10" height="16" fill="#525d6b" stroke="#39424e"/>
                    <rect x="81.5" y="159" width="7" height="18" fill="#414b58" stroke="#39424e" stroke-width="1"/>
                    <rect x="72" y="176" width="26" height="9" rx="4.5" fill="#39424e"/>
                    <rect x="130" y="145" width="10" height="16" fill="#525d6b" stroke="#39424e"/>
                    <rect x="131.5" y="159" width="7" height="18" fill="#414b58" stroke="#39424e" stroke-width="1"/>
                    <rect x="122" y="176" width="26" height="9" rx="4.5" fill="#39424e"/>
                </g>
                <!-- 伸缩腿：水下模式（收回贴腹，备用） -->
                <g id="legsStub">

<script>

    const storyData = {

            text: "塔卡没有动。一分钟。两分钟。\n\n它听到了完整的一首歌。\n\n咔哒。塔卡关机了。\n\n海鸥用巨大的翅膀，一点点把它推回了海面。\n\n它在日落时醒来。电池 0%。但记忆里有完整的风声。\n\n\"值了。\" 它身边坐着海鸥。\n\n（完 - 体验优先，有友兜底）",
            cost: 0,
            setBattery: 0,
            eyeState: "st-standby",
            endState: "st-off",
            choices: [
                { text: "重新开始故事", next: "start" }
            ]
        }
    };

    // ===== 电量状态机：全局真电量，场景只声明 cost（消耗量） =====
    // 场景字段：
    //   cost       进入本场景耗的电（缺省 10）
    //   sun        太阳事件回电（先扣后回，且救不了已经耗尽的电量）
    //   setBattery 结局场景强制值（ending_a 充满 / ending_b 关机归零）
    let battery = 100; // 单个故事的局部状态；进 start 场景时回满

    // 档位：耗尽(0) / 低(1-29) / 中(30-70 含) / 高(71-100)
    const tierOf = b => b <= 0 ? "depleted" : b < 30 ? "low" : b <= 70 ? "mid" : "high";

    function updateBatteryHUD() {
        document.getElementById("battery-text").innerText = battery + "%";
        const fill = document.getElementById("battery-fill");
        fill.style.width = battery + "%";
        fill.style.background = {
            high: "var(--ok-green)", mid: "var(--accent-dim)",
            low: "var(--low-orange)", depleted: "#7a4a12"
        }[tierOf(battery)];
    }

    // 场景实际灯光 = 声明的 eyeState 经电量档位修正：
    // 耗尽强制关灯；低电量把「待机」压成挣扎闪（场景显式指定的特殊状态不动）
    function eyeOf(scene) {
        const tier = tierOf(battery);
        return tier === "depleted" ? "st-off"
             : (tier === "low" && scene.eyeState === "st-standby") ? "st-low"
             : scene.eyeState;
    }

    // ===== 成就系统：进场景即解锁，幂等，localStorage 持久化 =====
    const achievements = {
        coral_cleaner: {
            name: '珊瑚清理者',
            icon: '🪸',
            desc: '不需要潜水服吗？',
            unlocked: false
        },
        inception: {
            name: '盗梦空间',
            icon: '💤',
            desc: '在梦里听见风声',
            unlocked: false
        },
        bond: {
            name: '羁绊',
            icon: '🔗',
            desc: '这就是我们之间的羁绊！',
            unlocked: false
        },
        homecoming: {
            name: '游子总要归乡',
            icon: '🏠',
            desc: '别怪我，我总得回家',
            unlocked: false
        },
        listen_to_wind: {
            name: '且听风吟',
            icon: '🌬️',
            desc: 'The answer is blowing in the wind',
            unlocked: false
        }
    };
    const ACH_KEY = "taka_achievements";
    // 场景 → 成就映射（覆盖 5 个分支目的地）
    const SCENE_ACHIEVEMENTS = {
        clean_branch: "coral_cleaner",
        dream: "inception",
        just_listen: "listen_to_wind",
        ending_a: "homecoming",
        ending_b: "bond"
    };
    // 读档：已解锁的 id 合并进定义
    try {
        JSON.parse(localStorage.getItem(ACH_KEY) || "[]").forEach(id => {
            if (achievements[id]) achievements[id].unlocked = true;
        });
    } catch {}

    function unlock(id) {
        const a = achievements[id];
        if (!a || a.unlocked) return false;
        a.unlocked = true;
        localStorage.setItem(ACH_KEY, JSON.stringify(
            Object.keys(achievements).filter(k => achievements[k].unlocked)));
        renderAchievements();
        return true;
    }

    let toastTimer = null;
    function showToast(html) {
        const t = document.getElementById("toast");
        t.innerHTML = html;
        t.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
    }

    // 成就弹窗列表：未解锁置灰（名字不遮，demo 需要可见）
    function renderAchievements() {
        const box = document.getElementById("ach-list");
        if (!box) return;
        box.innerHTML = Object.values(achievements).map(a =>
            `<div class="ach-item${a.unlocked ? "" : " locked"}">` +
            `<span class="ach-icon">${a.icon}</span><div>` +
            `<div class="ach-name">${a.name}</div><div class="ach-desc">${a.desc}</div>` +
            `</div></div>`
        ).join("");
    }

    function initAchievements() {
        const overlay = document.getElementById("ach-overlay");
        document.getElementById("ach-btn").onclick = () => {
            renderAchievements();
            overlay.hidden = !overlay.hidden;
        };
        overlay.onclick = () => { overlay.hidden = true; }; // 点遮罩关闭
        overlay.querySelector(".ach-modal").onclick = (e) => e.stopPropagation();
        renderAchievements();
    }

    let typing = null; // 打字机 timer
    let currentText = ""; // 当前场景实际展示的文本，作为下一场景的「前情」

    /* ===== AI 设置（localStorage，key 不出本机） ===== */
    const SETTINGS_KEY = "taka_ai_settings";
    const DEFAULT_SETTINGS = {
        baseUrl: "https://api.openai.com/v1",
        apiKey: "",
        model: "gpt-4o-mini",
        enabled: false
    };

    function loadSettings() {
        let s;
        try { s = { ...DEFAULT_SETTINGS, ...JSON.parse(localStorage.getItem(SETTINGS_KEY) || "{}") }; }
        catch { s = { ...DEFAULT_SETTINGS }; }
        // 历史默认值修正：DeepSeek 端点 + gpt 默认模型 → 自动换成 deepseek-v4-flash
        if (/deepseek/i.test(s.baseUrl) && s.model === "gpt-4o-mini") s.model = "deepseek-v4-flash";
        return s;
    }

    function initSettingsPanel() {
        const s = loadSettings();
        document.getElementById("sp-baseurl").value = s.baseUrl;
        document.getElementById("sp-key").value = s.apiKey;
        document.getElementById("sp-model").value = s.model;
        document.getElementById("sp-enabled").checked = s.enabled;
        const panel = document.getElementById("settings-panel");
        document.getElementById("settings-btn").onclick = () => { panel.hidden = !panel.hidden; };
        document.getElementById("sp-save").onclick = () => {
            localStorage.setItem(SETTINGS_KEY, JSON.stringify({
                baseUrl: document.getElementById("sp-baseurl").value.trim() || DEFAULT_SETTINGS.baseUrl,
                apiKey: document.getElementById("sp-key").value.trim(),
                model: document.getElementById("sp-model").value.trim() || DEFAULT_SETTINGS.model,
                enabled: document.getElementById("sp-enabled").checked
            }));
            speechPref.readChoices = document.getElementById("sp-readchoices").checked;
            speechPref.rate = Number(document.getElementById("sp-rate").value);
            localStorage.setItem(SPEECH_KEY, JSON.stringify(speechPref));
            panel.hidden = true;
            showStatus("设置已保存", 2000);
        };
        document.getElementById("sp-close").onclick = () => { panel.hidden = true; };
    }

    let statusTimer = null;
    function showStatus(msg, ms) {
        document.getElementById("ai-status").innerText = msg;
        clearTimeout(statusTimer);
        if (msg && ms) statusTimer = setTimeout(() => { document.getElementById("ai-status").innerText = ""; }, ms);
    }

    /* ===== 语音输出：浏览器 speechSynthesis，零配置、零网络、离线可跑 ===== */
    const SPEECH_KEY = "taka_speech";
    let speechPref = { on: true, readChoices: true, rate: 0.95 };
    try { speechPref = { ...speechPref, ...JSON.parse(localStorage.getItem(SPEECH_KEY) || "{}") }; } catch {}

    const speechSupported = "speechSynthesis" in window;
    let zhVoice = null;

    /* 角色声线：单一声音 + pitch/rate 区分（多语音包实测效果诡异，弃用）。
       rate 为「角色系数」——最终语速 = 基础语速（家长可调）× 系数 */
    const CHAR_PROFILE = {
        narrator:   { rate: 1.0,  pitch: 1.1  }, // 基准
        taka:       { rate: 0.93, pitch: 0.85 }, // 塔卡：沉稳、慢半拍的旧机器人
        seagull:    { rate: 1.1,  pitch: 1.35 }, // 海鸥：亮、快、活
        oldmachine: { rate: 0.84, pitch: 0.65 }  // 老机器：低沉迟缓
    };
    const SPEAKER_NAMES = { "塔卡": "taka", "海鸥": "seagull", "老机器": "oldmachine" };
    // 段内台词：角色名 + 最多 8 字引语（说/问/的信号很弱…）+ 冒号 + 台词
    const DIALOG_RE = /(塔卡|海鸥|老机器)([^：:]{0,8})[：:]["「]?([^"」]+?)["」]?\s*$/;

    function pickVoice() {
        if (!speechSupported) return;
        const voices = speechSynthesis.getVoices();
        const zh = voices.filter(v => v.lang && v.lang.toLowerCase().replace("_", "-").startsWith("zh"));
        // 优先本地声音（离线可用），Google 云端声音仅作兜底
        const local = zh.filter(v => v.localService);
        const pool = local.length ? local : zh;
        const preferred = ["xiaoxiao", "xiaoyi", "xiaobing", "ting", "mei", "sinji", "lilian",
                           "晓晓", "小冰", "婷婷", "美佳"];
        zhVoice = pool.find(v => preferred.some(p => v.name.toLowerCase().includes(p))) || pool[0] || null;
    }
    if (speechSupported) {
        pickVoice();
        speechSynthesis.onvoiceschanged = pickVoice; // Chrome 异步加载声音列表
    }

    function makeUtterance(text, who, rateOverride) {
        const prof = CHAR_PROFILE[who || "narrator"];
        const u = new SpeechSynthesisUtterance(text);
        if (zhVoice) u.voice = zhVoice;
        u.lang = "zh-CN";
        // 最终语速 = 基础语速（设置面板滑块，默认 0.95）× 角色系数，限制在 [0.5, 2]
        const base = rateOverride || speechPref.rate;
        u.rate = Math.min(2, Math.max(0.5, base * prof.rate));
        u.pitch = prof.pitch;
        return u;
    }

    // 把一段文本拆成「叙述 + 角色台词」片段，分别分配声线；
    // “塔卡：...” 的引语补成 “塔卡说”（纯名字时自动加“说”）
    function parseParagraph(p) {
        const m = p.match(DIALOG_RE);
        if (!m) return [{ who: "narrator", text: p }];
        let intro = (p.slice(0, m.index) + m[1] + m[2]).trim();
        if (intro === m[1]) intro = m[1] + "说";
        const segs = [];
        if (intro) segs.push({ who: "narrator", text: intro });
        segs.push({ who: SPEAKER_NAMES[m[1]], text: m[3] });
        return segs;
    }

    // 多音字修正表：发现一例加一例（key 替换为同音写法，仅影响朗读不改显示文本）。
    // 注：Web Speech API 不支持 SSML（标签会被读出来或忽略），治本等 TTS 升级
    const PRONUNCIATION_FIXES = {
        // 例："数一数": "鼠一鼠"
    };

    // 朗读前清洗：去掉（）内舞台说明（如“完 - 分享而非牺牲”）；
    // 去掉引号字符（中文语音会把 ASCII 直引号机械地念出来，角色对话靠语气自然区分）
    function cleanForSpeech(s) {
        let t = s.replace(/（[^）]*）/g, "")
                 .replace(/["“”「」『』]/g, "");
        for (const [k, v] of Object.entries(PRONUNCIATION_FIXES)) t = t.split(k).join(v);
        return t.trim();
    }

    const utteranceRefs = []; // 防 Chrome 把 utterance GC 掉（已知 bug：队列被回收→静默）
    let speechGen = 0; // 朗读代际：stopSpeech/新朗读使旧的延迟队列失效

    function queueSpeak(u) {
        utteranceRefs.push(u);
        if (utteranceRefs.length > 30) utteranceRefs.shift();
        speechSynthesis.speak(u);
    }

    // 正文朗读：按段拆成多条 utterance（规避 Chrome 长文本 ~15s 中断 bug）
    function speakStory(text) {
        if (!speechSupported || !speechPref.on) return;
        const gen = ++speechGen;
        speechSynthesis.cancel();
        // cancel 是异步的，立刻 speak 会被一起冲掉（Chrome 页面加载/刷新时高发）——延迟一个 tick
        setTimeout(() => {
            if (gen !== speechGen || !speechPref.on) return;
            text.split(/\n+/)
                .map(cleanForSpeech)
                .filter(Boolean)
                .flatMap(parseParagraph)
                .forEach(seg => queueSpeak(makeUtterance(seg.text, seg.who)));
            speechSynthesis.resume(); // 刷新后合成器可能卡在 paused，推一下
        }, 100);
    }

    // 选项朗读：排队在正文之后，不打断；两个选项时前缀“你选。”（呼应海鸥台词）
    // 有自由输入选项时，末尾补一句“或者，说说你的想法”
    function speakChoices(choices, hasFreeInput) {
        if (!speechSupported || !speechPref.on || !speechPref.readChoices || !choices || !choices.length) return;
        const prefix = choices.length > 1 ? "你选。" : "";
        const suffix = hasFreeInput ? "或者，说说你的想法。" : "";
        queueSpeak(makeUtterance(prefix + choices.map(c => cleanForSpeech(c.text)).join("。") + "。" + suffix));
    }

    function stopSpeech() {
        speechGen++; // 使排队中的延迟朗读失效
        if (speechSupported) speechSynthesis.cancel();
    }

    function initSpeech() {
        const btn = document.getElementById("speech-btn");
        const sync = () => { btn.innerText = speechPref.on ? "🔊" : "🔇"; };
        sync();
        document.getElementById("sp-readchoices").checked = speechPref.readChoices;
        // 语速滑块 + 试听
        const slider = document.getElementById("sp-rate");
        const rateVal = document.getElementById("sp-rate-val");
        slider.value = speechPref.rate;
        rateVal.innerText = Number(speechPref.rate).toFixed(2) + "x";
        slider.oninput = () => { rateVal.innerText = Number(slider.value).toFixed(2) + "x"; };
        document.getElementById("sp-preview").onclick = (e) => {
            e.stopPropagation();
            if (!speechSupported) return;
            stopSpeech();
            queueSpeak(makeUtterance("海底很亮。有很多光。塔卡的灯闪了一下。", "narrator", Number(slider.value)));
        };
        btn.onclick = () => {
            speechPref.on = !speechPref.on;
            if (!speechPref.on) stopSpeech();
            localStorage.setItem(SPEECH_KEY, JSON.stringify(speechPref));
            sync();
        };
    }

    /* ===== AI 生成：白名单填空，红线注入（AGENTS.md §3.3 / §5.3） ===== */
    const SYSTEM_PROMPT = `你在为 3-6 岁儿童互动故事《塔卡》撰写场景正文。
塔卡是一个旧铁皮机器人：单眼、暖黄色的灯、话少、诚实、温暖。

【文风要求】
- 海明威式极简：短句，主谓宾，极少形容词
- 每句不超过 15 字；用重复制造节奏（如"呼呼。"）
- 全文不超过 120 字，段与段之间空一行（3-5 段）
- 角色对话用中文引号
- 只输出正文：不要标题、不要解释、不要给全文加引号

【塔卡的身体（重要，不要写错）】
- 方形铁盒身体，没有嘴、没有脸：情绪只用一只暖黄色的灯（眼睛）表达，如“灯闪了三下”“灯光变亮”
- 在海里靠背部的螺旋桨推进，写“游上去、浮起来、往下沉”；腿是陆地用的，收在身体里，水里不要写走路和腿
- 手臂是链条，可以抓握
- 禁止出现：张嘴、吃、笑、走、跑、跳、弯腰、坐下

【价值观红线】
- 塔卡是中性机器人：指代一律用"它"，不用"他"或"她"
- 不评判孩子的选择，不说教
- 不写牺牲自己救别人；写"一起想办法"
- 不出现"听话才是好孩子"
- 不用宗教词汇；用科幻词（能量、信号、记忆库）
- 不恐吓，紧张感用环境描写表达`;

    function buildUserPrompt(scene, ctx) {
        const prev = (ctx && ctx.prevText) || "（故事开始）";
        const choice = (ctx && ctx.choiceText) || "（无）";
        const beats = (scene.beats || []).map(b => "- " + b).join("\n");
        let prompt = `【故事前情】\n${prev}\n\n【孩子的选择】\n${choice}${ctx && ctx.custom ? "（孩子自己输入的想法）" : ""}\n\n【本场景剧情要点】\n${beats}\n`;
        if (ctx && ctx.custom) {
            // 自定义选择必须生效：先接住（哪怕整活），再软引导回主线。不评判、不说教
            prompt += `\n【重要】孩子的选择必须生效：\n1. 第一段先回应这个选择：接住它，哪怕它偏离主线（塔卡可以真的开始照做，或说出它的想法）\n2. 再用环境或角色自然过渡，把故事引回剧情要点\n3. 剧情走向和结局不变，不评判孩子的想法\n`;
        }
        prompt += "\n请按剧情要点写出本场景正文。";
        return prompt;
    }

    async function generateSceneText(scene, ctx, settings) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 15000); // 15s 超时
        // 推理模型（deepseek-v4）先烧 reasoning 额度，极端输入下会无限反刍烧光预算→空正文。
        // 压低推理强度（仅 DeepSeek 端点加此参数，避免其他提供商报未知参数）
        const body = {
            model: settings.model,
            messages: [
                { role: "system", content: SYSTEM_PROMPT },
                { role: "user", content: buildUserPrompt(scene, ctx) }
            ],
            temperature: 0.8,
            max_tokens: 1200
        };
        if (/deepseek/i.test(settings.baseUrl)) body.reasoning_effort = "low";
        let res;
        try {
            res = await fetch(settings.baseUrl.replace(/\/+$/, "") + "/chat/completions", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + settings.apiKey
                },
                body: JSON.stringify(body),
                signal: controller.signal
            });
        } finally {
            clearTimeout(timer);
        }
        if (!res.ok) {
            // 带上服务端报错信息（如 “Model Not Exist”），否则排查只能靠猜
            let msg = "HTTP " + res.status;
            try {
                const err = await res.json();
                if (err && err.error && err.error.message) msg += "：" + err.error.message;
            } catch {}
            throw new Error(msg.slice(0, 80));
        }
        const data = await res.json();
        const text = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
        if (!text || !text.trim()) throw new Error("empty response");
        return text.trim();
    }

    function setFigureState(state) {
        document.getElementById("taka-figure").className = "taka-figure " + state;
    }

    // 双模式（spec §4.4）：水下 = 收腿悬浮（takaBodySwim），陆地 = 伸腿站立（takaBody）
    function setFigureMode(mode) {
        const use = document.querySelector("#taka-figure .takaBody use");
        use.setAttribute("href", mode === "swim" ? "#takaBodySwim" : "#takaBody");
    }

    function typeText(text, onDone) {
        const el = document.getElementById("story-text");
        el.innerText = "";
        el.scrollTop = 0; // 新场景从顶部开始；不做自动滚动（避免文字跑在语音前面）
        let i = 0;
        clearInterval(typing);
        typing = setInterval(() => {
            el.innerText = text.slice(0, ++i);
            if (i >= text.length) { clearInterval(typing); typing = null; onDone(); }
        }, 45);
        // 点击对话框立即补完
        document.getElementById("dialog").onclick = () => {
            if (typing) { clearInterval(typing); typing = null; el.innerText = text; onDone(); }
        };
    }

    let activeRec = null; // 进行中的语音识别（切场景时打断）

    // 自由输入选项 C：打字 / 语音，提交后编织进骨架（走默认主线 + 自定义文本传给 AI）
    function buildFreeInput(scene) {
        const row = document.createElement("div");
        row.className = "choice-input";
        row.onclick = (e) => e.stopPropagation();

        const input = document.createElement("input");
        input.type = "text";
        input.maxLength = 50;
        input.placeholder = "你选……";
        row.appendChild(input);

        // 语音输入（浏览器能力：Chrome 走云端，离线/不支持时隐藏 🎤）
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SR) {
            const mic = document.createElement("button");
            mic.innerText = "🎤";
            mic.title = "语音输入";
            const rec = new SR();
            rec.lang = "zh-CN";
            rec.interimResults = true;
            rec.onresult = (e) => {
                input.value = Array.from(e.results).map(r => r[0].transcript).join("");
            };
            rec.onend = () => { mic.classList.remove("recording"); if (activeRec === rec) activeRec = null; };
            rec.onerror = (e) => {
                const why = {
                    "not-allowed": "请允许麦克风权限（地址栏左侧图标可改）",
                    "service-not-allowed": "请允许麦克风权限（地址栏左侧图标可改）",
                    "network": "语音识别需要联网（Chrome 走云端）",
                    "audio-capture": "没找到麦克风",
                    "no-speech": "没听清，再试一次"
                }[e.error] || e.error;
                showStatus("🎤 " + why, 3500);
            };
            mic.onclick = () => {
                if (activeRec === rec) { rec.stop(); return; }
                try { rec.start(); activeRec = rec; mic.classList.add("recording"); } catch {}
            };
            row.appendChild(mic);
        }

        const send = document.createElement("button");
        send.innerText = "✓";
        send.title = "提交";
        const submit = async () => {
            const text = input.value.trim();
            if (!text) return;
            const settings = loadSettings();
            if (!(settings.enabled && settings.apiKey)) {
                // 留在页面：不清空输入、不走主线，孩子可以改选 A/B 或等大人开启 AI
                showStatus("塔卡还听不懂，需要大人在设置里开启 AI", 3000);
                return;
            }
            if (activeRec) { try { activeRec.abort(); } catch {} }
            const box = document.getElementById("choices");
            box.querySelectorAll("button, input").forEach(b => b.disabled = true);

            // 自定义选择没有 fallback 文案可退（孩子的整活只有 AI 接得住）：
            // 先在当前场景生成，成功才切场景；失败则恢复选项，孩子再选一次
            const nextKey = scene.choices[0].next;
            const nextScene = storyData[nextKey];
            setFigureState("st-thinking");
            showStatus("塔卡在想...");
            try {
                const genText = await generateSceneText(nextScene,
                    { prevText: currentText, choiceText: text, custom: true }, settings);
                showStatus("");
                renderScene(nextKey, { prevText: currentText, choiceText: text, custom: true, generated: genText });
            } catch (e) {
                console.warn("自定义选择生成失败：", e);
                const why = e.name === "AbortError" ? "超时" : (e.message || "网络错误");
                showStatus("塔卡没听懂（" + why + "），再选一次吧", 4500);
                setFigureState(eyeOf(scene));
                box.querySelectorAll("button, input").forEach(b => b.disabled = false);
            }
        };
        send.onclick = submit;
        input.onkeydown = (e) => { if (e.key === "Enter") submit(); };
        row.appendChild(send);
        return row;
    }

    function showChoices(scene) {
        const box = document.getElementById("choices");
        box.innerHTML = "";
        (scene.choices || []).forEach(c => {
            const btn = document.createElement("button");
            btn.className = "choice-btn";
            btn.innerText = c.text;
            // stopPropagation：choices 在 dialog 内，阻止冒泡触发打字机补完
            btn.onclick = (e) => {
                e.stopPropagation();
                // 立即禁用所有按钮，防双击产生重复生成请求
                box.querySelectorAll("button").forEach(b => b.disabled = true);
                renderScene(c.next, { prevText: currentText, choiceText: c.text });
            };
            box.appendChild(btn);
        });
        if (scene.freeInput) box.appendChild(buildFreeInput(scene));
        speakChoices(scene.choices, scene.freeInput); // 排队在正文朗读之后
    }

    function runListenBar(next) {
        const bar = document.getElementById("listen-bar");
        const fill = document.getElementById("progress-fill");
        bar.style.display = "flex";
        fill.style.width = "0%";
        let p = 0;
        const t = setInterval(() => {
            fill.style.width = (p += 2) + "%";
            if (p >= 100) {
                clearInterval(t);
                document.getElementById("choices").innerHTML =
                    `<button class="choice-btn" onclick="event.stopPropagation();this.disabled=true;renderScene('${next}', { prevText: currentText, choiceText: '静静听完风声' })">睁开眼睛，太阳升起来了...</button>`;
                speakChoices([{ text: "睁开眼睛，太阳升起来了" }]);
            }
        }, 80);
    }

    async function renderScene(key, ctx) {
        const scene = storyData[key];
        if (!scene) return;

        // --- 电量结算：先扣后回，太阳救不了已经耗尽的电量 ---
        if (key === "start") battery = 100;                     // 每个故事开始回满
        battery = Math.max(0, battery - (scene.cost ?? 10));    // 推进剧情耗电
        if (scene.sun && battery > 0)                           // 太阳回电
            battery = Math.min(100, battery + scene.sun);
        if (scene.setBattery != null) battery = scene.setBattery;
        updateBatteryHUD();

        // 非结局场景电量耗尽 → 系统级打断，强制被动结局（优先级高于任何选项）
        if (battery === 0 && scene.setBattery == null) {
            renderScene("ending_b", ctx);
            return;
        }

        // 成就：进场景即解锁（幂等，重开不重复弹；耗尽打断进 ending_b 也会解锁「羁绊」）
        const achId = SCENE_ACHIEVEMENTS[key];
        if (achId && unlock(achId)) {
            const a = achievements[achId];
            showToast(a.icon + " 解锁成就「" + a.name + "」<br><span class=\"toast-desc\">" + a.desc + "</span>");
        }

        stopSpeech(); // 切场景打断上一段朗读
        if (activeRec) { try { activeRec.abort(); } catch {} activeRec = null; }
        document.getElementById("choices").innerHTML = "";
        document.getElementById("listen-bar").style.display = "none";
        setFigureMode(scene.mode || "land");

        // AI 生成：仅中段场景（scene.ai）；无 key / 开关关 / 失败均静默回退内置文案
        let text = scene.text;
        const settings = loadSettings();
        if (ctx && ctx.generated) {
            text = ctx.generated; // 自定义选择：提交时已生成好，直接用（生成失败不会走到这里）
        } else if (scene.ai && settings.enabled && settings.apiKey) {
            setFigureState("st-thinking"); // 思考态即 loading：眼睛闪三下
            showStatus("塔卡在想...");
            try {
                text = await generateSceneText(scene, ctx, settings);
                showStatus("");
            } catch (e) {
                console.warn("AI 生成失败，回退本地文案：", e);
                const why = e.name === "AbortError" ? "超时" : (e.message || "网络错误");
                showStatus("已切换本地故事（" + why + "）", 4000);
            }
        }

        // 打字机期间 standby 临时切 speaking（spec §7）；特殊状态不被打断
        const eye = eyeOf(scene); // 电量档位修正后的实际灯光
        const duringTyping = eye === "st-standby" ? "st-speaking" : eye;
        setFigureState(duringTyping);

        currentText = text;
        speakStory(text); // 语音与打字机各自独立，同时开始
        typeText(text, () => {
            setFigureState(scene.endState || eye);
            if (scene.isSpecialListen) {
                runListenBar(scene.next);
            } else if (scene.choices && !scene.endState) {
                // 思考预告：闪三下（约 0.9s）再浮出选项
                const prev = eye;
                setFigureState("st-thinking");
                setTimeout(() => { setFigureState(prev); showChoices(scene); }, 900);
            } else {
                showChoices(scene); // endState 场景（结局 B）直接给「重新开始」
            }
        });
    }

    // 启动门：现代浏览器（Chrome/Safari 均）要求用户手势后才能 speechSynthesis，
    // 刷新会重置激活状态。把第一次点击变成「开始」仪式：手势里解锁合成器，再进 prologue。
    // 语音关闭/不支持时跳过门，直接开始。
    function initStartGate() {
        if (!speechSupported || !speechPref.on) {
            renderScene("prologue");
            return;
        }
        const gate = document.getElementById("start-gate");
        gate.hidden = false;
        const begin = () => {
            try {
                speechSynthesis.cancel(); // 清掉可能卡住的队列
                const u = new SpeechSynthesisUtterance(" "); // 手势内热身教
                u.volume = 0.01;
                speechSynthesis.speak(u);
            } catch {}
            gate.remove();
            renderScene("prologue");
        };
        document.getElementById("gate-btn").onclick = begin;
        gate.onclick = begin;
    }

    initSettingsPanel();
    initSpeech();
    initAchievements();
    initStartGate();

    // 首次交互补读：Safari 要求用户手势才能发声；Chrome 加载竞态漏读也能兜住。
    // 已在朗读/排队则不动（避免重复）
    document.addEventListener("pointerdown", function once() {
        document.removeEventListener("pointerdown", once);
        if (speechSupported && speechPref.on && currentText &&
            !speechSynthesis.speaking && !speechSynthesis.pending) {
            speakStory(currentText);
        }
    });
</script>

</body>
</html>
